plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aquaadir141.notesapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.aquaadir141.notesapp"
        minSdk 21
        targetSdk 34
        // CI passes the workflow run number so every release has a higher versionCode
        // than the one before and Android accepts it as an update.
        versionCode((System.getenv("VERSION_CODE") ?: "1").toInteger())
        versionName System.getenv("VERSION_NAME") ?: "1.0.0"
    }

    // Release signing comes from a stable keystore (see .github/workflows/build-apk.yml).
    // Every release must be signed with the same key, otherwise Android refuses to
    // install it over the previous version.
    def releaseKeystore = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Local builds without the keystore fall back to the debug key.
            signingConfig releaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
}
