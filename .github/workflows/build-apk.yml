name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy 'tools' package, which the
          # current SDK repository no longer offers, so setup fails.
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install SDK components
        run: sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Copy app icons
        run: |
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi; do
            mkdir -p android/app/src/main/res/$dir
            cp icon-192.png android/app/src/main/res/$dir/ic_launcher.png
          done
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp icon-512.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            # Pull request builds are never published, so the debug key is fine there.
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing this test build with the debug key."
              exit 0
            fi
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 secret. Without a stable signing key the new APK cannot install over the old one."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build Release APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease

      - name: Verify APK signature
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"

      - name: Find APK
        run: find android -name "*.apk"

      - name: Locate APK
        id: find_apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-app-apk
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "פתקי משימות v1.0.${{ github.run_number }}"
          body: |
            ## APK לאנדרואיד - פתקי משימות

            **להתקנה:**
            1. הורד את קובץ ה-APK מטה
            2. העבר לטלפון האנדרואיד
            3. הגדרות ← אבטחה ← אפשר התקנה ממקורות לא ידועים
            4. פתח את הקובץ והתקן
          files: ${{ steps.find_apk.outputs.path }}
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
